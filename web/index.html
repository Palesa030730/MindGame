<!DOCTYPE html>
<html>

<head>

    <title>Welcome to LetterMind</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 150px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 28px;
            font-weight: normal;
            color: #cccccc;
            margin-bottom: 30px;
        }

        p {
            font-size: 18px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .continue {
            padding: 15px 50px;
            background: #4CAF50;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .continue:hover {
            transform: scale(1.05);
        }

        .welcome {
            width: 600px;
            max-width: 90%;
            margin: auto;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="welcome">

            <h1>🧠 LETTERMIND</h1>

            <h2>
                Welcome to the Memory Letter Game!
            </h2>

            <p>

                Test your memory by memorizing
                letters and their positions.

                <br>

                Choose the correct letters in
                the correct order and see how
                good your memory really is!

            </p>

            <a href="player.jsp">

                <button class="continue">
                    CONTINUE
                </button>

            </a>

        </div>

    </div>

</body>

</html>
